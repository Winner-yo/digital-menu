services:
  db:
    image: postgres:16-alpine
    container_name: digital-menu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: digital_menu_db
    ports:
      - "5433:5432"
    volumes:
      - digital_menu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_menu_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  digital_menu_pgdata:
